name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只做「能不能编译」和「规则分类器对不对」，不安装 FastAPI/Playwright：
      # 适配器不在仓库里，装全依赖既慢也没意义。
      - name: Compile check
        run: python -m compileall -q app launcher.py tests

      - name: Rule classifier tests
        run: python -m unittest discover -s tests -v
